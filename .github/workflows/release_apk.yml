name: Build & Release APK (Root / Shizuku)

# 手动触发，或推送 v* 标签时自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 允许创建 Release 与上传资产
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK。setup-android action 在新版 cmdline-tools
      # 上因 'tools' 包被移除而失败，故这里手动定位 sdkmanager 并安装所需组件。
      - name: Install Android 17 SDK platform and build-tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-37.0" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build debug-signed APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebugSignedDebug --stacktrace --no-daemon

      - name: Prepare release asset
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debugSigned/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found" >&2; exit 1; fi
          cp "$APK" "Extinguish-Root-Shizuku-Android17.apk"
          echo "path=Extinguish-Root-Shizuku-Android17.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK metadata
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging Extinguish-Root-Shizuku-Android17.apk | grep -E '^(package|sdkVersion|targetSdkVersion|platformBuildVersionName)'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.10.1-tile-stop' }}
          name: Extinguish Root/Shizuku 双方案版（Android 17）
          body: |
            单磁贴一键息屏控制，Root 与 Shizuku 双特权方案随时切换。

            - Root 方案：基于 libsu 6.0.0 的 RootService（需 Magisk 等授予 Root）
            - Shizuku 方案：通过 Shizuku 授权，无需 Root
            - 单磁贴：首次点击启动并关屏，服务运行期间用音量键控制熄屏/亮屏，再次点击关闭服务
            - 截图手势（电源键+音量键同时按下）不会误触熄屏/亮屏
            - 适配 Android 17（API 37），compileSdk / targetSdk 均为 37

            说明：本 APK 使用调试签名（debugSigned）。若已安装原签名版本，请先卸载。
            在设置页（工作方案）中可随时切换 Root / Shizuku 特权方式。
          files: Extinguish-Root-Shizuku-Android17.apk
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
